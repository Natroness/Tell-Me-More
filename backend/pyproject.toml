[project]
name = "lorebook-backend"
version = "0.1.0"
description = "Lorebook API and AI pipeline"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "pillow>=12,<13",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
